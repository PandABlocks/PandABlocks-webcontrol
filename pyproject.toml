[build-system]
# Pin versions compatible with dls-python3 for reproducible wheels
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PandABlocks-webcontrol"
description = "Web UI for PandABlocks"
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "Tom Cobb", email = "tom.cobb@diamond.ac.uk"}]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
]
dependencies = [
    "numpy",
    "tornado",
]

[project.urls]
Homepage = "https://github.com/PandABlocks/PandABlocks-webcontrol"

[project.optional-dependencies]
# For development tests/docs
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    # test_context.py marks a test with @pytest.mark.timeout
    "pytest-timeout",
    # Formatter and linter both, replacing black, flake8 and isort
    "ruff",
]

[project.scripts]
panda-webcontrol = "malcolm.webcontrol:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
# Don't include our tests directory in the distribution
exclude = ["tests"]

[tool.setuptools.package-data]
malcolm = [
    "modules/*/*/*.svg",
    "modules/*/*/*/*.json",
    "modules/web/www/*",
    "modules/web/www/static/css/*",
    "modules/web/www/static/js/*",
    "modules/web/www/static/media/*",
]

[tool.mypy]
# Ignore missing stubs for modules we use
ignore_missing_imports = true

[tool.pytest.ini_options]
# Don't spam us with massive tracebacks on error. The --black and --mypy
# checkers that used to run from here needed pytest-black and pytest-mypy,
# both abandoned and neither installable, so pytest refused to start at all.
# Run those tools directly instead: `ruff format --check` and `mypy malcolm`.
addopts = "--tb=native -vv --doctest-modules"

[tool.ruff]
src = ["python", "tests"]
line-length = 88
lint.select = [
    "B",  # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "C4", # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "E",  # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
    "F",  # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
    "W",  # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
    "I",  # isort - https://docs.astral.sh/ruff/rules/#isort-i
    "UP", # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
]
lint.ignore = [
    # PEP 604 unions, `X | None` and `X | Y`. Annotations here are frequently
    # Anno *instances* rather than types - the `with Anno("..."): AFoo = str`
    # idiom - and an Anno has no __or__, so the rewrite raises TypeError while
    # the class body is being executed. UP045 applied to models.py is enough
    # to stop malcolm.core importing at all
    "UP007",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# An __init__.py here exists to re-export, and submodule_all() builds __all__
# from the module namespace at import time. Ruff sees only unused imports
# F811: the same annotype is re-exported from several submodules
"**/__init__.py" = ["F401", "F811"]
# The vendored annotypes re-exports typing names for its callers to import
# from (see _typing.py, and the Mapping/Any/Union that modules take from
# malcolm.annotypes), and resolves string annotations against module globals
# at runtime. Its "unused" typing imports are load-bearing
# F811: @overload stubs, which ruff misses because overload comes from the
# package's own _typing shim rather than from typing directly
# UP035: its annotations are py2-style `# type:` comments, which name
# typing.Dict and friends; swapping the imports for builtins breaks them
"malcolm/annotypes/*.py" = ["F401", "F811", "UP035"]
